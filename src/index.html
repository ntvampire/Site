<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__USERNAME__ — Проекты</title>
  <meta name="description" content="Каталог проектов и репозиториев __USERNAME__ на GitHub">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-hover: #1c2128;
      --border: #30363d;
      --border-focus: #58a6ff;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --text-dim: #6e7681;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --tag-bg: #21262d;
      --tag-text: #c9d1d9;
      --tag-active-bg: #388bfd33;
      --tag-active-text: #58a6ff;
      --tag-active-border: #58a6ff;
      --btn-bg: #21262d;
      --btn-border: #363b42;
      --btn-hover-bg: #30363d;
      --action-code-bg: #0a0d12;
      --action-success: #3fb950;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: 40px 20px;
      width: 100%;
      flex: 1;
    }

    header {
      margin-bottom: 36px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 12px;
    }

    .site-title {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .site-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      object-fit: cover;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .site-title span {
      color: var(--text-muted);
      font-weight: 400;
    }

    .header-link {
      font-family: var(--font-mono);
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--card-bg);
      transition: color 0.15s, border-color 0.15s;
    }

    .header-link:hover {
      text-decoration: none;
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .header-desc {
      color: var(--text-muted);
      font-size: 15px;
      max-width: 720px;
    }

    /* Controls: Search & Filter */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 15px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: var(--border-focus);
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filter-label {
      font-size: 13px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      margin-right: 4px;
    }

    .tag-btn {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--tag-text);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 12px;
      cursor: pointer;
      font-family: var(--font-mono);
      transition: all 0.15s;
    }

    .tag-btn:hover {
      background: var(--card-hover);
      color: var(--text-main);
    }

    .tag-btn.active {
      background: var(--tag-active-bg);
      border-color: var(--tag-active-border);
      color: var(--tag-active-text);
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      font-family: var(--font-mono);
    }

    /* Projects List (1 in a row) */
    .grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .card:hover {
      border-color: #444c56;
      background: var(--card-hover);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      word-break: break-word;
    }

    .card-title a {
      color: var(--accent);
    }

    .card-links {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      transition: color 0.15s, border-color 0.15s;
    }

    .icon-link:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
      text-decoration: none;
    }

    .card-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .card-badges a {
      display: inline-flex;
      text-decoration: none;
    }

    .card-badges img {
      max-height: 22px;
      height: auto;
      border-radius: 3px;
      display: inline-block;
      vertical-align: middle;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 14px;
      flex-grow: 1;
    }

    .card-topics {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .topic-pill {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--tag-text);
      background: var(--tag-bg);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* Quick Actions */
    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      margin-top: 4px;
    }

    .downloads-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-family: var(--font-mono);
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      width: auto;
    }

    .action-btn:hover {
      background: var(--btn-hover-bg);
      border-color: var(--accent);
      color: var(--text-main);
      text-decoration: none;
    }

    .action-link-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-family: var(--font-mono);
    }

    .action-btn-left {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .action-badge {
      font-size: 11px;
      color: var(--text-dim);
      padding-left: 4px;
    }

    .action-command-box {
      background: var(--action-code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .action-command-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .action-command-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-command-code {
      font-family: var(--font-mono);
      font-size: 12px;
      color: #7ee787;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-grow: 1;
      user-select: all;
    }

    .copy-btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-family: var(--font-mono);
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .copy-btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .copy-btn.copied {
      color: var(--action-success);
      border-color: var(--action-success);
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .lang-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .lang-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
      grid-column: 1 / -1;
      font-family: var(--font-mono);
      font-size: 14px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    @media (max-width: 640px) {
      .container {
        padding: 24px 16px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <h1 class="site-title" id="siteTitle">
          <img id="userAvatar" class="site-avatar" src="favicon.png" alt="__USERNAME__" onerror="this.src='https://github.com/__USERNAME__.png'">
          <span>__USERNAME__</span> <span>/ Проекты</span>
        </h1>
        <a id="profileLink" class="header-link" href="https://github.com/__USERNAME__" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          GitHub Профиль
        </a>
      </div>
      <p class="header-desc">
        Каталог открытых репозиториев и разрабатываемых проектов. Страница обновляется автоматически.
      </p>
    </header>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию, описанию или стеку..." autocomplete="off">
      </div>
      <div class="filter-tags" id="filterTags">
        <span class="filter-label">Языки:</span>
        <button class="tag-btn active" data-lang="all">Все</button>
      </div>
    </div>

    <div class="meta-bar">
      <div>Показано: <span id="countDisplay">0</span></div>
      <div id="syncTime">Обновлено: —</div>
    </div>

    <main class="grid" id="projectsGrid">
      <!-- Карточки генерируются скриптом -->
    </main>
  </div>

  <footer>
    Сгенерировано автоматически с использованием GitHub Actions &amp; GitHub Pages
  </footer>

  <!-- PROJECTS_DATA_PLACEHOLDER -->

  <script>
    (function() {
      const projects = window.PROJECTS_DATA || [];
      const buildInfo = window.BUILD_INFO || {};

      let currentLang = 'all';
      let searchQuery = '';

      const grid = document.getElementById('projectsGrid');
      const searchInput = document.getElementById('searchInput');
      const filterTags = document.getElementById('filterTags');
      const countDisplay = document.getElementById('countDisplay');
      const syncTime = document.getElementById('syncTime');
      const profileLink = document.getElementById('profileLink');
      const siteTitle = document.getElementById('siteTitle');

      if (buildInfo.username && buildInfo.username !== 'Developer') {
        profileLink.href = 'https://github.com/' + encodeURIComponent(buildInfo.username);
        siteTitle.innerHTML = `<img id="userAvatar" class="site-avatar" src="favicon.png" alt="${escapeHtml(buildInfo.username)}" onerror="this.src='https://github.com/${encodeURIComponent(buildInfo.username)}.png'"> <span>${escapeHtml(buildInfo.username)}</span> <span>/ Проекты</span>`;
      }

      if (buildInfo.generatedDate) {
        const d = new Date(buildInfo.generatedDate);
        syncTime.textContent = 'Обновлено: ' + d.toLocaleDateString('ru-RU', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      }

      // Populate language filters
      const languages = [...new Set(projects.map(p => p.language).filter(Boolean))].sort();
      languages.forEach(lang => {
        const btn = document.createElement('button');
        btn.className = 'tag-btn';
        btn.dataset.lang = lang;
        btn.textContent = lang;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-tags .tag-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLang = lang;
          render();
        });
        filterTags.appendChild(btn);
      });

      const allBtn = filterTags.querySelector('[data-lang="all"]');
      allBtn.addEventListener('click', () => {
        document.querySelectorAll('.filter-tags .tag-btn').forEach(b => b.classList.remove('active'));
        allBtn.classList.add('active');
        currentLang = 'all';
        render();
      });

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        render();
      });

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatDate(isoStr) {
        if (!isoStr) return '';
        const d = new Date(isoStr);
        return d.toLocaleDateString('ru-RU', {
          day: '2-digit',
          month: 'short',
          year: 'numeric'
        });
      }

      function getLanguageColor(lang) {
        const colors = {
          'JavaScript': '#f1e05a',
          'TypeScript': '#3178c6',
          'Python': '#3572A5',
          'Go': '#00ADD8',
          'Rust': '#dea584',
          'C++': '#f34b7d',
          'C': '#555555',
          'C#': '#178600',
          'Java': '#b07219',
          'HTML': '#e34c26',
          'CSS': '#563d7c',
          'PHP': '#4F5D95',
          'Ruby': '#701516',
          'Shell': '#89e051',
          'PowerShell': '#012456',
          'Kotlin': '#A97BFF',
          'Swift': '#F05138'
        };
        return colors[lang] || '#8b949e';
      }

      window.copyToClipboard = function(text, btnElement) {
        navigator.clipboard.writeText(text).then(() => {
          const original = btnElement.textContent;
          btnElement.textContent = '✓ Скопировано';
          btnElement.classList.add('copied');
          setTimeout(() => {
            btnElement.textContent = original;
            btnElement.classList.remove('copied');
          }, 2000);
        }).catch(err => {
          console.error('Clipboard error:', err);
        });
      };

      function renderActions(actions) {
        if (!actions || actions.length === 0) return '';

        const downloads = actions.filter(a => a.type === 'download');
        const commands = actions.filter(a => a.type === 'command');
        const links = actions.filter(a => a.type === 'copy_link');

        let downloadsHtml = '';
        if (downloads.length > 0) {
          downloadsHtml = `
            <div class="downloads-row">
              ${downloads.map(act => `
                <a href="${escapeHtml(act.url)}" class="action-btn" target="_blank" rel="noopener">
                  <span class="action-btn-left">
                    <span>📥</span>
                    <span>${escapeHtml(act.label || 'Скачать релиз')}</span>
                  </span>
                  ${act.size ? `<span class="action-badge">${escapeHtml(act.size)}</span>` : ''}
                </a>
              `).join('')}
            </div>
          `;
        }

        const commandsHtml = commands.map(act => {
          const cmd = act.command || act.copyText || '';
          return `
            <div class="action-command-box">
              <div class="action-command-header">
                <span>${escapeHtml(act.label || 'Команда запуска')}</span>
                <span>${escapeHtml(act.note || '')}</span>
              </div>
              <div class="action-command-row">
                <code class="action-command-code" title="${escapeHtml(cmd)}">${escapeHtml(cmd)}</code>
                <button type="button" class="copy-btn" onclick="copyToClipboard('${escapeHtml(cmd).replace(/'/g, "\\'")}', this)">
                  Копировать
                </button>
              </div>
            </div>
          `;
        }).join('');

        const linksHtml = links.map(act => {
          const url = act.url || act.copyText || '';
          return `
            <div class="action-link-bar">
              <span class="action-btn-left">
                <span>🔗</span>
                <span>${escapeHtml(act.label || 'Ссылка')}</span>
                ${act.note ? `<span class="action-badge">${escapeHtml(act.note)}</span>` : ''}
              </span>
              <span style="display: inline-flex; gap: 8px;">
                <button type="button" class="copy-btn" onclick="copyToClipboard('${escapeHtml(url).replace(/'/g, "\\'")}', this)">
                  Копировать
                </button>
                <a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="copy-btn" style="text-decoration: none;">
                  Открыть ↗
                </a>
              </span>
            </div>
          `;
        }).join('');

        return `<div class="card-actions">${downloadsHtml}${commandsHtml}${linksHtml}</div>`;
      }

      function render() {
        const filtered = projects.filter(p => {
          const matchLang = (currentLang === 'all') || (p.language === currentLang);
          if (!matchLang) return false;

          if (!searchQuery) return true;
          const matchName = p.name.toLowerCase().includes(searchQuery);
          const matchDesc = p.description.toLowerCase().includes(searchQuery);
          const matchTopics = p.topics.some(t => t.toLowerCase().includes(searchQuery));
          return matchName || matchDesc || matchTopics;
        });

        countDisplay.textContent = filtered.length;

        if (filtered.length === 0) {
          grid.innerHTML = '<div class="empty-state">Проекты не найдены по заданным критериям</div>';
          return;
        }

        grid.innerHTML = filtered.map(p => {
          const topicsHtml = (p.topics && p.topics.length > 0)
            ? `<div class="card-topics">${p.topics.map(t => `<span class="topic-pill">#${escapeHtml(t)}</span>`).join('')}</div>`
            : '';

          const homepageLink = p.homepage
            ? `<a href="${escapeHtml(p.homepage)}" target="_blank" rel="noopener" class="icon-link" title="Демо / Веб-сайт">↗</a>`
            : '';

          const langHtml = p.language
            ? `<div class="lang-badge"><span class="lang-dot" style="background-color: ${getLanguageColor(p.language)}"></span>${escapeHtml(p.language)}</div>`
            : `<span></span>`;

          const badgesHtml = (p.badges && p.badges.length > 0)
            ? `<div class="card-badges">${p.badges.map(b => {
                const img = `<img src="${escapeHtml(b.imageUrl)}" alt="${escapeHtml(b.alt || 'badge')}" loading="lazy">`;
                return b.linkUrl ? `<a href="${escapeHtml(b.linkUrl)}" target="_blank" rel="noopener">${img}</a>` : img;
              }).join('')}</div>`
            : '';

          const actionsHtml = renderActions(p.actions);

          return `
            <article class="card">
              <div>
                <div class="card-head">
                  <h2 class="card-title">
                    <a href="${escapeHtml(p.url)}" target="_blank" rel="noopener">${escapeHtml(p.name)}</a>
                  </h2>
                  <div class="card-links">
                    ${homepageLink}
                    <a href="${escapeHtml(p.url)}" target="_blank" rel="noopener" class="icon-link" title="GitHub Репозиторий">
